#builds every docs version and deploys the site to GitHub Pages
name: docs
on:
  push:
    branches:
      - master
  #after a release of any version (a `release` trigger wouldn't fire, since releases are created by the workflow's GITHUB_TOKEN)
  workflow_run:
    workflows: ['Publish Release']
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      #full history and tags, to build each version from its newest release tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: website

      - run: npm run build-docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - id: deployment
        uses: actions/deploy-pages@v5
