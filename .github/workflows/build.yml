name: build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      #full history + tags, so the docs build can find (and clone) the newest release tag for each docs version
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@master
        with:
          node-version: "18.20.4"
          architecture: 'x64' # fix for macos-latest
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # make sure the transpiled brightscript examples in docs/ match what the compiler actually produces
      - if: matrix.os == 'ubuntu-latest'
        run: npm run transpile-doc-examples -- --check
      - run: npm run test
      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        env:
          #hardcode the coveralls token...it's not overly important to protect, and github actions won't allow forks to work with coveralls otherwise
          COVERALLS_REPO_TOKEN: "kVPcGJfehOArEQnHb8BT3KS72xbUQCoxI"
        with:
          path-to-lcov: ./coverage/lcov.info
      # make sure the docs site builds (deploying it is docs.yml's job). Docusaurus needs node 20+
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@master
        with:
          node-version: 22
      - if: matrix.os == 'ubuntu-latest'
        run: npm ci
        working-directory: website
      - if: matrix.os == 'ubuntu-latest'
        run: npm run build-docs
      # this is stalling out for some reason, so disable it for now
      #- run: npm run test-related-projects